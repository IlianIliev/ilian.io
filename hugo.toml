baseURL = "https://ilian.io/"
title = "ilian.io"
theme = "ilian"
languageCode = "en-us"
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[permalinks]
  [permalinks.page]
    posts = "/:slug/"

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    style = "default"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services]
  [services.disqus]
    shortname = "YOUR_DISQUS_SHORTNAME"

[params]
  author = "Ilian Iliev"
  description = "Ilian Iliev's personal blog about Python, Django, and web development"
  githubURL = "https://github.com/ilianiliev"
  linkedinURL = "https://www.linkedin.com/in/iliansiliev"
  googleAnalyticsID = "UA-16684989-1"
